<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    font-family: "Segoe UI", sans-serif;
    background: #0B0C0E;
    position: relative;
    color: #f8fafc;
  }
  .stage { position: absolute; inset: 0; }
  svg.bg { position: absolute; inset: 0; }
  .content {
    position: absolute;
    inset: 0;
    padding: 84px 100px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .brand-row { display: flex; align-items: center; gap: 18px; margin-bottom: 46px; }
  .brand-name { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
  .version {
    font-size: 20px; font-weight: 700; color: #a5b4fc;
    background: rgba(99,102,241,0.16); padding: 5px 14px; border-radius: 999px;
    letter-spacing: 0.3px;
  }
  .headline {
    font-size: 88px;
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 1.02;
  }
  .headline .accent { color: #a5b4fc; }
  .subhead {
    margin-top: 18px;
    font-size: 32px;
    font-weight: 500;
    color: #94a3b8;
    max-width: 620px;
    line-height: 1.3;
  }
  .layout { display: flex; align-items: flex-end; justify-content: space-between; gap: 44px; }
  .left { flex: 1; }

  /* Portfolio card — a designed element, not a screenshot. Values are
     illustrative and rounded; no real wallet is shown. */
  .card {
    width: 580px;
    background: linear-gradient(160deg, rgba(30,27,75,0.55), rgba(17,17,20,0.85));
    border: 1px solid rgba(99,102,241,0.35);
    border-radius: 22px;
    padding: 28px 32px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.45);
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .card-title { font-size: 23px; font-weight: 700; color: #e2e8f0; }
  .ro-badge {
    font-size: 15px; font-weight: 700; color: #22d3ee;
    background: rgba(34,211,238,0.12); padding: 4px 11px; border-radius: 8px;
    letter-spacing: 0.3px;
  }
  .rows { display: flex; flex-direction: column; gap: 15px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; }
  .row-label { font-size: 21px; font-weight: 600; color: #94a3b8; }
  .row-value { font-size: 27px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .row-value .unit { font-size: 18px; font-weight: 600; color: #64748b; margin-left: 5px; }
  .row.locked .row-label,
  .row.locked .row-value { color: #64748b; font-size: 19px; font-weight: 600; }
  .divider { height: 1px; background: rgba(148,163,184,0.14); margin: 4px 0; }
  .card-foot {
    margin-top: 20px; padding-top: 18px;
    border-top: 1px solid rgba(148,163,184,0.14);
    font-family: Consolas, monospace; font-size: 19px; color: #c7d2fe;
  }
  .card-meta { margin-top: 7px; font-size: 16px; color: #64748b; }

  .footer {
    position: absolute;
    left: 100px; bottom: 64px;
    display: flex; align-items: center; gap: 15px;
    font-size: 23px; color: #94a3b8; font-weight: 500;
  }
  .footer .dot { color: #475569; }
  .footer .cta { color: #22d3ee; font-family: Consolas, monospace; }
</style>
</head>
<body>
<div class="stage">
  <svg class="bg" width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="glow" cx="0.72" cy="0.35" r="0.55">
        <stop offset="0" stop-color="#4f46e5" stop-opacity="0.25"/>
        <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1600" height="900" fill="#0B0C0E"/>
    <rect width="1600" height="900" fill="url(#glow)"/>
    <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" id="grid"></g>
  </svg>

  <div class="content">
    <div class="brand-row">
      <svg width="54" height="54" viewBox="0 0 48 48" fill="none">
        <defs>
          <linearGradient id="q" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
            <stop stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/>
          </linearGradient>
        </defs>
        <circle cx="21" cy="22" r="13" stroke="url(#q)" stroke-width="4" fill="none"/>
        <path d="M20 30 l3.5 0 l2.5 -6 l3 12 l2.5 -8 l2 4 l3 0" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="39" cy="10" r="6" fill="#22d3ee"/>
        <circle cx="39" cy="10" r="6" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
      </svg>
      <div class="brand-name">QuaiWatch</div>
      <div class="version">v7.0</div>
    </div>

    <div class="layout">
      <div class="left">
        <div class="headline">Portfolio<br />&amp; <span class="accent">public API</span></div>
        <div class="subhead">Connect Pelagus, or paste any address</div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title">Address overview</div>
          <div class="ro-badge">READ-ONLY</div>
        </div>
        <div class="rows">
          <div class="row">
            <span class="row-label">QUAI</span>
            <span class="row-value">1,284.62<span class="unit">QUAI</span></span>
          </div>
          <div class="row locked">
            <span class="row-label">locked</span>
            <span class="row-value">320.00 QUAI</span>
          </div>
          <div class="divider"></div>
          <div class="row">
            <span class="row-label">Qi</span>
            <span class="row-value">48.512<span class="unit">Qi</span></span>
          </div>
          <div class="divider"></div>
          <div class="row">
            <span class="row-label">Tokens</span>
            <span class="row-value">6<span class="unit">QRC-20</span></span>
          </div>
        </div>
        <div class="card-foot">No signature requested</div>
        <div class="card-meta">Cyprus-1 &middot; official Quai Explorer data</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <span>Balances &amp; history</span>
    <span class="dot">&middot;</span>
    <span>Free API, no key</span>
    <span class="dot">&middot;</span>
    <span class="cta">quaiwatch.pages.dev</span>
  </div>
</div>

<script>
  let g = '';
  for (let gx = 0; gx <= 1600; gx += 80) g += `<line x1="${gx}" y1="0" x2="${gx}" y2="900"/>`;
  for (let gy = 0; gy <= 900; gy += 80) g += `<line x1="0" y1="${gy}" x2="1600" y2="${gy}"/>`;
  document.getElementById('grid').innerHTML = g;
</script>
</body>
</html>
